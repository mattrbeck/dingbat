<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dingbat DS (prototype)</title>
<style>
  :root { --bg: #15161a; --panel: #1f2127; --fg: #e6e6e6; --dim: #9aa0aa; --accent: #f2b33d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; display: flex; gap: 24px;
         flex-wrap: wrap; justify-content: center; }
  .screens { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  canvas { width: 512px; max-width: calc(100vw - 32px); aspect-ratio: 4 / 3;
           image-rendering: pixelated; background: #000; border-radius: 4px; }
  #bottom { cursor: crosshair; touch-action: none; }
  .panel { background: var(--panel); border-radius: 8px; padding: 16px; min-width: 260px;
           display: flex; flex-direction: column; gap: 12px; align-self: flex-start; }
  h1 { font-size: 16px; margin: 0; color: var(--accent); }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
  button, select { font: inherit; background: #2c2f37; color: var(--fg); border: 1px solid #3a3e48;
                   border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  #status { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--dim);
            white-space: pre-wrap; }
  .keys { font-size: 12px; color: var(--dim); }
  .row { display: flex; gap: 8px; }
</style>
</head>
<body>
<main>
  <div class="screens">
    <canvas id="top" width="256" height="192"></canvas>
    <canvas id="bottom" width="256" height="192"></canvas>
  </div>
  <div class="panel">
    <h1>dingbat DS prototype</h1>
    <label>Demo ROM
      <select id="demo">
        <option value="">(choose)</option>
        <option value="nds/demos/fb_hello.nds">fb_hello (engine A VRAM display)</option>
        <option value="nds/demos/fb_both.nds">fb_both (both engines)</option>
        <option value="nds/demos/snd_tone.nds">snd_tone (ARM7 sound: square + saw)</option>
        <option value="nds/demos/snd_suite.nds">snd_suite (SPU test timeline, ~14 s)</option>
      </select>
    </label>
    <label>Load .nds
      <input type="file" id="rom" accept=".nds">
    </label>
    <label>BIOS / firmware (bios9.bin, bios7.bin, firmware.bin; remembered)
      <input type="file" id="bios" multiple>
    </label>
    <div class="row">
      <button id="pause">Pause</button>
      <button id="step">Step frame</button>
      <button id="reset">Reset</button>
      <button id="mute">Mute</button>
    </div>
    <div id="status">loading core…</div>
    <div class="keys">Arrows · X=A · Z=B · S=X · A=Y · Q=L · W=R · Enter=Start · Shift=Select · mouse on the bottom screen = touch</div>
  </div>
</main>
<script src="nds/nds-page.js"></script>
<script src="nds/nds.js"></script>
</body>
</html>
