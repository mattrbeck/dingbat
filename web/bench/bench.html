<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>dingbat perf bench</title>
  <style>
    body { font: 13px/1.5 ui-monospace, monospace; background:#111; color:#ddd; padding:16px; }
    pre { white-space: pre-wrap; }
    #out { border:1px solid #333; padding:8px; min-height:200px; }
  </style>
</head>
<body>
<h3>dingbat throughput bench</h3>
<canvas id="sdl-canvas" width="960" height="640" hidden aria-hidden="true"></canvas>
<pre id="out">booting…</pre>
<script>
// NOTE: em.js declares plenty of short top-level names (`out`, `err`, `log`…).
// Everything here is scoped inside an IIFE / on `window` to avoid colliding.
// The app's service worker precaches ./em.js and ./em.wasm by fixed name at
// root scope, so it also controls /bench/. Benchmarking two builds by swapping
// those two files on disk then silently measures whichever one the SW cached
// FIRST — an A/B that always comes out a dead heat, with matching framebuffer
// hashes to "confirm" it. Unregister before anything loads, and check the
// build identity with benchBuildId() below.
if (navigator.serviceWorker) {
  navigator.serviceWorker.getRegistrations?.().then((rs) => rs.forEach((r) => r.unregister()));
}
// Byte length of the em.wasm this page actually loaded. Two builds differ in
// size, so this is a positive identification of which one is being measured.
window.benchBuildId = () => {
  const e = performance.getEntriesByType("resource")
    .filter((r) => r.name.endsWith("em.wasm")).pop();
  return e ? { size: e.decodedBodySize, transfer: e.transferSize,
               fromSW: !!e.deliveryType || e.transferSize === 0 } : null;
};

const bOut = document.getElementById("out");
const bLog = (s) => { bOut.textContent += s + "\n"; console.log(s); };
window.benchReady = false;

var Module = {
  canvas: document.getElementById("sdl-canvas"),
  preRun: [],
  onRuntimeInitialized: () => { window.benchRuntimeUp = true; },
};

// Fetch ROM + state before the module boots so preRun can plant the ROM in FS.
const romP = fetch("PokemonFireRed.gba").then(r => r.arrayBuffer());
const stP  = fetch("PokemonFireRed.state").then(r => r.arrayBuffer());

let ROM = null, STATE = null;

window.benchInit = async () => {
  ROM = new Uint8Array(await romP);
  STATE = new Uint8Array(await stP);
  Module.FS.writeFile("PokemonFireRed.gba", ROM);
  Module.ccall("initFromEmscripten", null, ["string"], ["PokemonFireRed.gba"]);
  return { rom: ROM.length, state: STATE.length };
};

// Load the save state into the live core.
window.benchLoadState = () => {
  const p = Module._malloc(STATE.length);
  // Build the heap view AFTER _malloc — growth can detach the old buffer.
  new Uint8Array(Module.memory.buffer, p, STATE.length).set(STATE);
  const ok = Module._wasm_load_state(p, STATE.length);
  Module._free(p);
  return ok === 1;
};

window.benchSetHle = (on) => {
  Module._wasm_set_mp2k_hle(on ? 1 : 0);
  return Module._wasm_hle_audio_active ? Module._wasm_hle_audio_active() : -1;
};

window.benchHleActive = () => Module._wasm_hle_audio_active();

// Run `frames` frames of pure emulation, return fps. Audio buffer is drained
// so the wasm-side ring doesn't grow without bound across a long run.
window.benchRun = (frames) => {
  const t0 = performance.now();
  Module._benchFrames(frames);
  const ms = performance.now() - t0;
  if (Module._clearAudioBuffer) Module._clearAudioBuffer();
  return { frames, ms, fps: frames * 1000 / ms };
};

// Bit-exactness gate for an A/B of two builds: reload the state, run `frames`
// frames, and hash the framebuffer. `_wasm_fb_ptr` is a pure LUT conversion of
// the raw BGR555 buffer, so an identical hash means an identical framebuffer.
// FNV-1a in 32-bit chunks (JS has no cheap u64 mul).
window.benchHash = (frames) => {
  window.benchLoadState();
  Module._benchFrames(frames);
  if (Module._clearAudioBuffer) Module._clearAudioBuffer();
  const p = Module._wasm_fb_ptr();
  const v = new Uint8Array(Module.memory.buffer, p, 240 * 160 * 4);
  let h = 0x811c9dc5;
  for (let i = 0; i < v.length; i++) {
    h ^= v[i];
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return { frames, hash: h.toString(16) };
};

// Rewind cost end to end: benchFramesFull runs what loop_tick runs per frame
// (clip note + rewind push + frame prepare), so the fps difference between
// mask 0 and mask 1 IS what the rewind ring costs in the shipping loop.
window.benchRewind = (frames = 600, reps = 7) => {
  if (!Module._benchFramesFull) return "build has no -d:defaultsprobe";
  window.benchSetHle(false);
  const run = (mask) => {
    window.benchLoadState();
    if (Module._wasm_probe_setpad) Module._wasm_probe_setpad(1);
    Module._wasm_probe_disable(mask);
    const t0 = performance.now();
    Module._benchFramesFull(frames);
    const ms = performance.now() - t0;
    if (Module._clearAudioBuffer) Module._clearAudioBuffer();
    return frames * 1000 / ms;
  };
  const on = [], off = [];
  for (let i = 0; i < reps; i++) { on.push(run(0)); off.push(run(1)); }
  on.sort((a,b)=>a-b); off.sort((a,b)=>a-b);
  const mOn = on[(on.length/2)|0], mOff = off[(off.length/2)|0];
  return "rewind ON " + mOn.toFixed(1) + " fps, OFF " + mOff.toFixed(1) +
         " fps  -> rewind costs " + ((mOff-mOn)/mOff*100).toFixed(2) + "%";
};

// Rewind-delta codec bake-off (-d:codecbench builds only). Runs the same
// candidates over the same deltas as the native harness, prints the table on
// screen, and reports it back through the dev server's log — which is how
// Safari, which cannot be driven from the shell, delivers its numbers.
window.benchCodecs = (pushes = 24, interval = 10, reps = 3) => {
  if (!Module._wasm_codec_bench) return "build has no -d:codecbench";
  window.benchLoadState();
  const n = Module._wasm_codec_bench(pushes, interval, reps);
  const txt = Module.UTF8ToString(Module._wasm_codec_report());
  return "deltas=" + n + "\n" + txt;
};

// Median-of-N trial for stable numbers.
window.benchTrial = (frames, reps) => {
  const r = [];
  for (let i = 0; i < reps; i++) r.push(window.benchRun(frames).fps);
  r.sort((a, b) => a - b);
  return { median: r[(r.length / 2) | 0], min: r[0], max: r[r.length - 1], all: r };
};
// Self-reporting mode for browsers that cannot be driven from the shell
// (Safari, and any device browser): open bench.html?auto=1 and the page runs
// the trial itself and prints the numbers on screen, large enough to read off
// a photo or a screenshot. ?frames= and ?reps= override the defaults.
window.benchAuto = async () => {
  const q = new URLSearchParams(location.search);
  const frames = Number(q.get("frames") || 600);
  const reps = Number(q.get("reps") || 7);
  bOut.style.fontSize = "18px";
  bLog("waiting for runtime…");
  while (!window.benchRuntimeUp) await new Promise((r) => setTimeout(r, 100));
  await window.benchInit();
  bLog("UA: " + navigator.userAgent);
  bLog("build: " + JSON.stringify(window.benchBuildId()));
  // Which GPU-timing instrument this browser offers, so a settings sweep knows
  // whether present-path costs are measurable here at all.
  try {
    const g = document.createElement("canvas").getContext("webgl2");
    bLog("webgl2=" + !!g + " timerQuery=" +
         !!(g && g.getExtension("EXT_disjoint_timer_query_webgl2")) +
         " simd=" + WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,26,11])));
  } catch (e) { bLog("gl probe failed: " + e); }
  for (const hle of [false, true]) {
    window.benchSetHle(hle);
    const r = [];
    for (let i = 0; i < reps; i++) {
      window.benchLoadState();
      r.push(window.benchRun(frames).fps);
      await new Promise((x) => setTimeout(x, 0)); // let the page paint
    }
    r.sort((a, b) => a - b);
    bLog(`HLE ${hle ? "on " : "off"}  median ${r[(r.length / 2) | 0].toFixed(1)} fps` +
         `  best ${r[r.length - 1].toFixed(1)}  min ${r[0].toFixed(1)}`);
  }
  bLog("HASH(400) = " + window.benchHash(400).hash);
  bLog("DONE");
  // Report back through the dev server's request log, so a browser that
  // cannot be driven from the shell (Safari: Apple Events to it need Develop
  // > "Allow JavaScript from Apple Events", which is off by default) still
  // delivers its numbers somewhere readable. The 404 is expected; the query
  // string is the payload.
  try {
    await fetch("/__benchresult?" +
                encodeURIComponent(bOut.textContent.replace(/\n/g, " | ")));
  } catch (e) { /* reporting is best-effort */ }
};
// ?codecs=1 runs the rewind-delta codec bake-off instead of the throughput
// trial, on the same self-reporting path, so Safari can produce the table.
window.benchCodecAuto = async () => {
  const q = new URLSearchParams(location.search);
  bOut.style.fontSize = "15px";
  bLog("waiting for runtime…");
  while (!window.benchRuntimeUp) await new Promise((r) => setTimeout(r, 100));
  await window.benchInit();
  bLog("UA: " + navigator.userAgent);
  bLog("build: " + JSON.stringify(window.benchBuildId()));
  bLog("CompressionStream: " + (typeof CompressionStream !== "undefined"));
  if (Module._benchFramesFull) { bLog(window.benchRewind(600, 7)); bLog("DONE"); 
    try { await fetch("/__benchresult?" + encodeURIComponent(bOut.textContent.replace(/\n/g," | "))); } catch(e){}
    return; }
  bLog(window.benchCodecs(Number(q.get("pushes") || 24),
                          Number(q.get("interval") || 10),
                          Number(q.get("reps") || 3)));
  bLog("DONE");
  try {
    await fetch("/__benchresult?" +
                encodeURIComponent(bOut.textContent.replace(/\n/g, " | ")));
  } catch (e) { /* best effort */ }
};
const _q = new URLSearchParams(location.search);
if (_q.get("codecs") === "1") addEventListener("load", () => window.benchCodecAuto());
else if (_q.get("auto") === "1") addEventListener("load", () => window.benchAuto());
</script>
<script src="session.js"></script>
<script async src="../em.js"></script>
</body>
</html>
