name: Test Suite
# workflow_dispatch: re-run a suspected flake without pushing a dummy commit.
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A green job is ~15 min on Windows, ~3 on Linux; an hour is headroom so a
    # wedged step reports instead of burning the 6h default.
    timeout-minutes: 60
    env:
      # Cached test-ROM dir, read by tests/dingbat_test_runner.nim.
      DINGBAT_ROM_CACHE: ${{ github.workspace }}/rom-cache
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
      - name: Cache downloaded test ROMs
        # Exact key, no restore-keys: the runner reuses any present file by
        # name, so a partial restore could serve a stale ROM. Bump the matching
        # segment whenever a download URL/version in dingbat_test_runner.nim
        # changes; `suite<sha>` must track MgbaSuiteSha1 in the same commit.
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/rom-cache
          key: test-roms-${{ runner.os }}-gb7.0-dmg1.0-cgb1.1-suiteda67466e-jsmolka-a6447c5-fuzzarm-a675329-magen0.5.0-shootout38b926b
      - name: Install dependencies
        # Only zippy: the full dep tree pulls GUI-only packages whose install
        # fails on the Windows runner. Retry, then prove the import works.
        shell: bash
        run: |
          echo 'import zippy/ziparchives' > depcheck.nim
          for i in 1 2 3; do
            # cd out of the checkout: inside it nimble resolves the whole graph
            (cd "$RUNNER_TEMP" && nimble install -y zippy) || true
            if nim check --hints:off depcheck.nim; then rm depcheck.nim; exit 0; fi
            echo "dependencies incomplete after attempt $i, retrying"
            sleep 10
          done
          exit 1
      - name: Build test binaries (all nine, in parallel)
        # Nine independent `nim c` runs in parallel; the steps below only run
        # what this built. Flag rationale lives in the script.
        shell: bash
        run: .github/scripts/build-tests.sh
      - name: Run tests
        # Blargg / Mooneye / mGBA suite / Acid2 / Mealybug / jsmolka / gambatte.
        # Exits non-zero only on a regression against tests/results.md.
        run: ./dingbat_test_runner
      - name: GBA PPU compositor invariants
        # Self-comparing compositor invariants (no golden hashes, no ROMs).
        # -d:test_harness gates nothing the compositor touches, so this is the
        # shipping code.
        shell: bash
        run: ./dingbat_ppucomposite_test
      - name: GBA 4bpp BG tile-unpack equivalence
        # Enumerates the SWAR 4bpp unpack against the scalar fallback (which
        # exists only under -d:test_harness). The full 2^32 sweep is opt-in via
        # DINGBAT_BG4_EXHAUSTIVE=1. No ROMs.
        shell: bash
        run: ./dingbat_ppubgunpack_test
      - name: GBA per-line OBJ candidate list (differential fuzz)
        # Randomized OAM tables rendered via the candidate list and the full
        # scan must produce byte-identical sprite_pixels. No ROMs.
        shell: bash
        run: ./dingbat_ppuobjlist_test
      - name: Save-state format compatibility
        # Loads the reference states in tests/states and pins every EventType
        # ordinal (the scheduler serializes events by ordinal) and the legacy
        # container -> revision table at compile time. No downloaded ROMs.
        shell: bash
        run: ./dingbat_savestate_compat_test
      - name: Rewind ring (IDs, eviction, keyframes, thumbnail strip)
        # Ring eviction/keyframe bookkeeping checked against a plain walk of
        # the delta chain. Synthetic payloads; no ROMs.
        shell: bash
        run: ./dingbat_rewind_test
      - name: LCD panel-response model invariants
        # Self-comparing panel-model invariants: static frames bit-exact,
        # transitions reach their target, 30 Hz alternation settles. No ROMs.
        shell: bash
        run: ./dingbat_lcdresponse_test
      - name: GB battery-save RTC/mapper footers
        # MBC3 footer round-trip with catch-up; a padded or unknown tail must
        # not parse as a clock. Synthetic ROMs/saves.
        shell: bash
        run: ./dingbat_savefooter_test
      - name: Clip-capture replay determinism
        # Replays a range from the anchor+input log and asserts every frame's
        # serialized state matches the live run; two negative controls must
        # fail. Committed ROMs only.
        shell: bash
        run: ./dingbat_clipreplay_test
      - name: GB HBlank-DMA re-entrancy (Pokemon Crystal boot crash)
        # gbhdmatest.gbc re-arms HBlank HDMA forever; the block copy ticks the
        # PPU inside the mode 3->0 transition, which recurses to stack overflow
        # unless lcd_status shows mode 0 first. Pass = the process survives.
        shell: bash
        run: ./dingbat_test tests/roms/gbhdmatest.gbc --mode=screenshot --timeout=120 --screenshot=hdmatest.ppm
      - name: Link acceptance (in-process lockstep)
        shell: bash
        run: |
          set -e
          ./dingbat_test tests/roms/linktest.gba --mode=linktest --timeout=600
          # linkskew: the child stages its multi-mode word late; passes only
          # with the completion-time latch (link.nim complete_multi).
          ./dingbat_test tests/roms/linkskew.gba --mode=linktest --timeout=600
          ./dingbat_test tests/roms/normlinktest.gba --mode=normlinktest --timeout=600
          ./dingbat_test tests/roms/norm32linktest.gba --mode=norm32linktest --timeout=600
          # Mid-game attach: boot cable-less, plug the link in mid-run, negotiate.
          ./dingbat_test tests/roms/attachtest.gba --mode=attachtest --timeout=1200
          # Predict+rollback of the remote input must be bit-identical to
          # inputs known upfront; also guards savestate completeness.
          ./dingbat_test tests/roms/inputrec.gba --mode=rollback
          # Two RollbackSessions exchanging inputs over a delay, both bit-identical.
          ./dingbat_test tests/roms/inputrec.gba --mode=rollbacknet
      - name: Speculative rollback acceptance (bit-identical to the blocking path)
        # The speculative link must reproduce the blocking path's EWRAM log.
        shell: bash
        run: |
          set -e
          ./dingbat_test tests/roms/linktest.gba --mode=speclink \
            --link-contract=multi --netlink-delay-ms 30 --timeout=800
          ./dingbat_test tests/roms/normlinktest.gba --mode=speclink \
            --link-contract=normal --netlink-delay-ms 30 --timeout=800
          ./dingbat_test tests/roms/norm32linktest.gba --mode=speclink \
            --link-contract=normal32 --netlink-delay-ms 30 --timeout=800
          # Echo predictor must stay bit-identical (overrun=0) and cut re-emulation.
          ./dingbat_test tests/roms/speclinkbench.gba --mode=speclinkbench \
            --netlink-delay-ms 50 --timeout=20000
      - name: Link acceptance (networked, localhost)
        # netcore.nim over a real socket. Linux only: localhost sockets and
        # backgrounding are reliable there.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          run_net() {
            local rom=$1 contract=$2 port=$3
            ./dingbat_test "$rom" --mode=netlink --link-contract="$contract" \
              --listen "$port" --timeout 1200 > listener.log 2>&1 &
            local pid=$!
            sleep 1
            ./dingbat_test "$rom" --mode=netlink --link-contract="$contract" \
              --connect 127.0.0.1:"$port" --timeout 1200
            wait "$pid"          # listener's exit code (fails the step if != 0)
            cat listener.log
            grep -q "NETLINK LINKTEST: PASS" listener.log
          }
          run_net tests/roms/linktest.gba multi 7788
          run_net tests/roms/normlinktest.gba normal 7789
          run_net tests/roms/norm32linktest.gba normal32 7790
      - name: Web storage / Drive / SW unit tests (Node, zero deps)
        # node:vm harness over the real web/index.js, plus the sw-assets
        # tripwire: every script index.html loads must be in the SW precache.
        if: runner.os == 'Linux'
        run: node --test web/tests/*.test.mjs
      - name: Web JSDoc typecheck (tsc --checkJs)
        # tsc over the shipped .js (allowJs+checkJs+noEmit), one project per
        # entry point. gen-emdts --check keeps web/types/em.d.ts in lockstep
        # with the {.exportc.} procs in src/dingbat_wasm.nim.
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          set -e
          ../.github/scripts/retry.sh 3 npm ci
          npx tsc -p types/tsconfig.main.json
          npx tsc -p types/tsconfig.embed.json
          npx tsc -p types/tsconfig.sw.json
          node types/gen-emdts.mjs --check
      - name: Signaling server room lifecycle (Node)
        # A room code must be freed the instant its clients disconnect, not at TTL.
        if: runner.os == 'Linux'
        run: node web/signaling/server.test.mjs
      - name: Web present-shader UV tripwire (pure Node, no browser)
        # Asserts the live `v_uv` expression in web/glpresent.js maps the
        # screen to the full [0,1] texture, row 0 at the top.
        run: node web/uv.test.mjs
      - name: Cache Playwright's Chromium
        # Exact key on the lockfile: a playwright bump must miss and re-download.
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Web browser tests (headless Chromium)
        # render.test.mjs compiles the real present shaders and checks corner
        # mapping (needs WebGL2); manualpair.test.mjs round-trips the manual-
        # code link fallback over real RTCPeerConnections. Installs only Chromium.
        if: runner.os == 'Linux'
        working-directory: web
        # npm ci and the Chromium download are idempotent network fetches.
        run: |
          set -e
          ../.github/scripts/retry.sh 3 npm ci
          ../.github/scripts/retry.sh 3 npx playwright install --with-deps chromium
          node render.test.mjs
          node manualpair.test.mjs
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            tests/results.md
            tests/results_mgba_suite.md
            tests/results_gambatte.md
