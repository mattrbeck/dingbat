name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        # choosenim fetches its script and then the toolchain; retry both.
        run: |
          set -eo pipefail
          .github/scripts/retry.sh 3 bash -c \
            'curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 \
               https://nim-lang.org/choosenim/init.sh | sh -s -- -y'
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.23"

      - name: Install nimble dependencies
        # nimble queries the package's git remote for tags: a network fetch.
        run: .github/scripts/retry.sh 3 nimble install -y sdl2

      - name: Build WASM
        run: nim c -d:emscripten src/dingbat_wasm.nim

      - name: Stamp service worker version
        run: |
          sed -i "s/CACHE_VERSION = \"dev\"/CACHE_VERSION = \"${GITHUB_SHA::7}\"/" web/sw.js
          grep -q "CACHE_VERSION = \"${GITHUB_SHA::7}\"" web/sw.js || {
            echo "::error::CACHE_VERSION stamping failed - sed pattern did not match in web/sw.js"
            exit 1
          }
          echo -n "${GITHUB_SHA::7}" > web/version.txt

      - name: Minify web assets
        # Runs AFTER the sw.js stamp, and sw.js is never minified: index.js's
        # update checker regex-matches the literal `CACHE_VERSION = "..."`.
        # JS gets --minify-whitespace --minify-syntax only, never
        # --minify-identifiers: these are classic <script> files sharing one
        # global scope (createGlRenderer, SDPCodec, window.* hooks, `Module`)
        # and esbuild minifies each file independently. Filenames are kept:
        # the SW ASSETS list and index.html reference them by name.
        run: |
          set -eo pipefail
          .github/scripts/retry.sh 3 npm install --no-save --no-audit --no-fund esbuild@0.28.1
          for f in index.js netplay.js glpresent.js sdputil.js embed.js; do
            npx esbuild "web/$f" --minify-whitespace --minify-syntax \
              --outfile="web/$f" --allow-overwrite
          done
          for f in styles.css embed.css; do
            npx esbuild "web/$f" --minify --outfile="web/$f" --allow-overwrite
          done
          # The stamp must have survived (sw.js untouched by the loops above)
          grep -q "CACHE_VERSION = \"${GITHUB_SHA::7}\"" web/sw.js || {
            echo "::error::sw.js was altered by minification - update check would break"
            exit 1
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
