name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Nothing under these ships (the site is web/ plus the wasm build). Other
    # pushes deploy, but only a change to what the app runs moves the version
    # (see "Pick the version"): a new one makes every open copy offer an update.
    paths-ignore: ["docs/**", "tools/**", "notes/**", "README.md", "README/**", ".claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          # Pinned, as test.yml's NIM_VERSION.
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-4.0.23

      - name: Install Emscripten
        # As test.yml's wasm job (the two share the cache above).
        run: .github/scripts/install-emsdk.sh 4.0.23

      - name: Cache nimble's zippy
        id: nimble-cache
        uses: actions/cache@v4
        with:
          path: ~/.nimble/pkgs2
          key: nimble-wasm-${{ runner.os }}-nim2.2.12-zippy-0.10.20

      - name: Install nimble dependencies
        # nimble queries the package's git remote for tags: a network fetch.
        # Pinned, and from outside the checkout, as test.yml's wasm job (the
        # two share the cache above).
        if: steps.nimble-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: ${{ github.workspace }}/.github/scripts/retry.sh 3 nimble install -y zippy@0.10.20

      - name: Build WASM
        run: nim c -d:emscripten src/dingbat_wasm.nim

      - name: Build the DS core's WASM
        # web/nds/nds.{js,wasm}: fetched only when a DS game loads, which
        # needs DS Beta on (Settings > General > Advanced).
        run: nim c -d:emscripten src/dingbat_nds_wasm.nim

      - name: Leave out the DS dev page
        # tools/serve_nds_dev.sh's standalone core page and its probes.
        run: rm -f web/nds.html web/nds/nds-page.js web/nds/audio-probe.mjs web/nds/shot.mjs

      - name: Minify web assets
        # sw.js is never minified: index.js's update checker regex-matches the
        # literal `CACHE_VERSION = "..."` the stamp below writes.
        # JS gets --minify-whitespace --minify-syntax only, never
        # --minify-identifiers: these are classic <script> files sharing one
        # global scope (createGlRenderer, SDPCodec, window.* hooks, `Module`)
        # and esbuild minifies each file independently. Filenames are kept:
        # the SW ASSETS list and index.html reference them by name.
        run: |
          set -eo pipefail
          .github/scripts/retry.sh 3 npm install --no-save --no-audit --no-fund esbuild@0.28.1
          for f in index.js netplay.js glpresent.js sdputil.js embed.js nds/ndsutil.js nds/ndsaudio.js; do
            npx esbuild "web/$f" --minify-whitespace --minify-syntax \
              --outfile="web/$f" --allow-overwrite
          done
          for f in styles.css embed.css; do
            npx esbuild "web/$f" --minify --outfile="web/$f" --allow-overwrite
          done

      - name: Find the live site
        id: pages
        uses: actions/configure-pages@v5

      - name: Pick the version
        # A new version is an update offer in every open copy, so it moves
        # only when what the app runs does: a hash of every file under web/
        # (sw.js still saying "dev") but the development-only ones. The build
        # is reproducible, so a commit that leaves those bytes alone (desktop,
        # iOS, tests, formal) hashes as the live site does and redeploys under
        # the live version: the same sw.js and version.txt, no update. The
        # probe busts the edge cache as sw.js's probeVersion does; on any
        # failure (the first deploy, an outage) the commit is the version.
        run: |
          set -eo pipefail
          content=$(cd web && find . -type f \
              ! -path './bench/*' ! -path './e2e/*' ! -path './tests/*' \
              ! -path './types/*' ! -path './signaling/*' ! -path './node_modules/*' \
              ! -name '*.test.mjs' ! -name 'package.json' ! -name 'package-lock.json' \
              ! -name 'serve.py' ! -name 'lattest.html' -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          live=$(curl -fsS --max-time 30 \
            "${{ steps.pages.outputs.base_url }}/build-id.txt?probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true)
          read -r live_content live_version <<< "$live" || true
          version=${GITHUB_SHA::7}
          if [ "$live_content" = "$content" ] && [[ "$live_version" =~ ^[0-9a-f]{7}$ ]]; then
            version=$live_version
            echo "::notice::The app is unchanged ($content): staying on $version"
          else
            echo "::notice::The app changed (${live_content:-none} -> $content): version $version"
          fi
          echo "$content $version" > web/build-id.txt
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Stamp service worker version
        run: |
          sed -i "s/CACHE_VERSION = \"dev\"/CACHE_VERSION = \"${VERSION}\"/" web/sw.js
          grep -q "CACHE_VERSION = \"${VERSION}\"" web/sw.js || {
            echo "::error::CACHE_VERSION stamping failed - sed pattern did not match in web/sw.js"
            exit 1
          }
          echo -n "${VERSION}" > web/version.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
