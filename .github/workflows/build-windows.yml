name: Build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cross-compile image
        # Pulls the nim base image and apt/SDL2 over the network on every run
        # (no layer cache on the runner), so a transient registry/mirror hiccup
        # would otherwise be a red build.
        run: .github/scripts/retry.sh 3 docker build -t dingbat-win-cross docker/windows-cross
      - name: Build dingbat.exe
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            dingbat-win-cross ./docker/windows-cross/build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dingbat-windows-x64
          path: dist/windows/dingbat.exe
          if-no-files-found: error
