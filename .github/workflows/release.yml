name: Release

# Build all three desktop artifacts on a version tag and publish a Release.
# The builds live in build-artifacts.yml, shared with the per-push Build
# workflow. Binaries are unsigned — see README.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-artifacts.yml

  # Collect the artifacts, checksum them, and publish a Release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage + checksum
        # Same script as the rolling "latest" release.
        run: .github/scripts/stage-release.sh artifacts release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
