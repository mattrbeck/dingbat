name: Release

# Build Linux, macOS and Windows artifacts on a version tag and publish them to
# the GitHub Releases page. The builds themselves live in build-artifacts.yml,
# which the per-push Build workflow also calls — so what ships in a release is
# byte-for-byte the same recipe that has been exercised on every commit, rather
# than a second copy that only ever runs on tags.
#
# Binaries are UNSIGNED — see README for the one-time "open anyway" steps users
# take on first launch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-artifacts.yml

  # Collect the artifacts, checksum them, and publish a Release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage + checksum
        run: |
          set -e
          mkdir -p release
          cp artifacts/dingbat-linux-x64/dingbat-linux-x64.tar.gz release/
          cp artifacts/dingbat-macos/dingbat-macos.dmg           release/dingbat-macos.dmg
          cp artifacts/dingbat-windows-x64/dingbat.exe           release/dingbat-windows-x64.exe
          cd release && shasum -a 256 * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
