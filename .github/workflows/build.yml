name: Build

# Checks that the desktop app builds on all three platforms, on every push and
# PR. The binaries stay in the run's Artifacts for testing; they are not
# published, and are unsigned.
on:
  push:
    branches: [main]
    # No input to a desktop build (test.yml's list).
    paths-ignore: ["docs/**", "tools/**", "README.md", ".github/readme/**", ".claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  artifacts:
    uses: ./.github/workflows/build-artifacts.yml
