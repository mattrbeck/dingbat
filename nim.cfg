# The GUI app links SDL 3 at build time on every platform: dynlibOverride
# turns the sdl3 package's {.dynlib.} procs into ordinary link-time symbols,
# which the imgui backend (compiled from C++ against <SDL3/SDL.h>) needs
# anyway.
@if not test_harness:
  @if macosx and not emscripten:
    dynlibOverride = "SDL3"
    passC = "-DCIMGUI_USE_OPENGL3 -I/opt/homebrew/include"
    # -d:macdist links SDL3 statically (framework list = sdl3.pc's
    # Libs.private less the camera's AVFoundation and CoreMedia) so the .app
    # has no Homebrew dependency. Homebrew's sdl3 has no libSDL3.a; CI builds
    # one without the camera from source (.github/scripts/build-sdl3.sh).
    @if macdist:
      passL = "/opt/homebrew/lib/libSDL3.a -lm -lpthread -framework OpenGL -Wl,-framework,CoreVideo -Wl,-framework,Cocoa -Wl,-weak_framework,UniformTypeIdentifiers -Wl,-framework,IOKit -Wl,-framework,ForceFeedback -Wl,-framework,Carbon -Wl,-framework,CoreAudio -Wl,-framework,AudioToolbox -Wl,-framework,Foundation -Wl,-framework,GameController -Wl,-framework,Metal -Wl,-framework,QuartzCore -Wl,-weak_framework,CoreHaptics"
    @else:
      passL = "-L/opt/homebrew/lib -lSDL3 -framework OpenGL"
    @end
  @end

  @if linux and not emscripten:
    # <SDL3/SDL.h> resolves from /usr/include or /usr/local/include. -lSDL3
    # takes a static libSDL3.a where that is all there is (the release
    # build's, from source: Ubuntu 22.04 has no SDL 3 package); SDL loads
    # X11/Wayland/ALSA/PulseAudio/PipeWire itself at run time either way.
    dynlibOverride = "SDL3"
    passL = "-lGL -lSDL3 -lm -ldl -lpthread"
    passC = "-DCIMGUI_USE_OPENGL3"
  @end

  # Windows: static SDL3 so dingbat.exe ships alone. SDL 3's mingw devel
  # package has only the DLL and its import lib, so build-artifacts.yml and
  # docker/windows-cross build libSDL3.a from source into the sysroot; it is
  # linked by full path, and the -l list after it is sdl3.pc's Libs.private.
  @if windows:
    # GUI subsystem: no console window, so stdout is invisible; use the
    # console-subsystem test binaries for diagnostics.
    app = "gui"
    dynlibOverride = "SDL3"
    passC = "-DCIMGUI_USE_OPENGL3 -I/usr/x86_64-w64-mingw32/include"
    passL = "/usr/x86_64-w64-mingw32/lib/libSDL3.a -lopengl32 -lm -lkernel32 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lversion -luuid -ladvapi32 -lsetupapi -lshell32 -ldinput8 -static-libgcc -static-libstdc++"
    # Link with g++: the imgui objects need the C++ runtime
    # (__cxa_guard_*/__gxx_personality_*).
    amd64.windows.gcc.linkerexe = "x86_64-w64-mingw32-g++"
  @end
@end

# Single-threaded: threads off avoids TLV overhead, ARC avoids the cycle collector.
threads = "off"
mm = "arc"

# Debug builds keep runtime checks but optimize the generated C: -O0 runs at
# half realtime.
opt = "speed"

# Apple clang's AArch64 machine outliner (on at -O2+) turns the hottest
# straight-line code into call/return pairs; disabling it is ~+35% fps with
# pixel-identical output. Covers macOS and iOS; wasm has no equivalent pass.
@if arm64 and not emscripten:
  passC = "-mno-outline"
@end
