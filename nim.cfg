# macOS: link SDL2 statically via homebrew; link OpenGL framework
@if not test_harness:
  @if macosx and not emscripten:
    dynlibOverride = "SDL2"
    passC = "-DCIMGUI_USE_OPENGL3 -I/opt/homebrew/include/SDL2"
    # -d:macdist statically links SDL2 (+ its system frameworks) so a
    # distributable .app has no Homebrew dependency. The framework list mirrors
    # `sdl2-config --static-libs`. Plain dev builds link SDL2 dynamically.
    @if macdist:
      passL = "/opt/homebrew/lib/libSDL2.a -lm -lobjc -framework OpenGL -Wl,-framework,CoreAudio -Wl,-framework,AudioToolbox -Wl,-weak_framework,CoreHaptics -Wl,-weak_framework,GameController -Wl,-framework,ForceFeedback -Wl,-framework,CoreVideo -Wl,-framework,Cocoa -Wl,-framework,Carbon -Wl,-framework,IOKit -Wl,-weak_framework,QuartzCore -Wl,-weak_framework,Metal"
    @else:
      passL = "-L/opt/homebrew/lib -lSDL2 -framework OpenGL"
    @end
  @end

  @if linux and not emscripten:
    # imgui's SDL2 backend does `#include <SDL.h>`, so the SDL2 include dir has
    # to be on the path the same way it is for macOS and Windows below. Without
    # it the GUI target does not compile on Linux at all — only the headless
    # test binaries do, which is why this went unnoticed until CI started
    # building the desktop app. /usr/include/SDL2 is where Debian/Ubuntu
    # (libsdl2-dev) and Fedora (SDL2-devel) both put it, and it is what
    # `sdl2-config --cflags` reports on each.
    #
    # SDL2 itself stays dynamically linked here (no dynlibOverride): the Nim
    # wrapper dlopens libSDL2-2.0.so.0 at startup, so a distributed Linux build
    # needs the runtime package (libsdl2-2.0-0) present. That is the ordinary
    # arrangement on Linux and keeps this a plain, small binary.
    passL = "-lGL"
    passC = "-DCIMGUI_USE_OPENGL3 -I/usr/include/SDL2"
  @end

  # Windows: statically link SDL2 (zlib-licensed) so dingbat.exe is a single
  # file with no DLLs to ship. libSDL2.a is referenced by full path because
  # -lSDL2 would prefer the import lib (libSDL2.dll.a) in the same directory;
  # the -l list after it is SDL2's static Win32 dependencies.
  @if windows:
    # GUI subsystem: no console window opens behind the emulator. Trade-off:
    # stdout (echo/pacing logs) is invisible even when launched from a
    # terminal; use the console-subsystem test binaries for diagnostics.
    app = "gui"
    dynlibOverride = "SDL2"
    passC = "-DCIMGUI_USE_OPENGL3 -I/usr/x86_64-w64-mingw32/include/SDL2"
    passL = "/usr/x86_64-w64-mingw32/lib/libSDL2.a -lopengl32 -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid -static-libgcc -static-libstdc++"
    # Link with g++ so the C++ runtime needed by the imgui objects is pulled
    # in (Nim's default mingw linker is the C driver, which leaves
    # __cxa_guard_*/__gxx_personality_* unresolved).
    amd64.windows.gcc.linkerexe = "x86_64-w64-mingw32-g++"
  @end
@end

# Performance: disable threads (we're single-threaded) to avoid TLV overhead,
# and use ARC instead of ORC to eliminate cycle-collector cost.
threads = "off"
mm = "arc"

# Debug builds keep all runtime checks and stack traces, but compile the
# generated C with optimization: an -O0 debug build runs at half realtime,
# too slow for interactive testing, while opt:speed keeps the same checks and
# runs ~5x faster. -d:release/-d:danger already imply opt:speed.
opt = "speed"

# Apple's clang enables the AArch64 machine outliner by default at -O2 and
# above. It factors recurring instruction sequences into shared subroutines to
# save code size — which in an emulator means the hottest straight-line code
# (the CPU dispatch prologue, the PPU inner loops) pays a call/return per
# occurrence. It showed up in profiles as a wall of OUTLINED_FUNCTION_* leaf
# samples, ~15-20% of total.
#
# Measured on an M2, Pokemon FireRed from an in-game save state:
# 511 -> 693 fps (+35%), output pixel-identical across 60 ROMs and the mGBA
# suite score unchanged (6910/7008).
#
# Covers the macOS and iOS builds (ios/build-core.sh compiles --cpu:arm64).
# The wasm backend has no equivalent pass — em.wasm is byte-identical with and
# without the flag — so the browser build neither gains nor loses here.
@if arm64 and not emscripten:
  passC = "-mno-outline"
@end
