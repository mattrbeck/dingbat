# macOS: link SDL2 statically via homebrew; link OpenGL framework
@if not test_harness:
  @if macosx and not emscripten:
    dynlibOverride = "SDL2"
    passL = "-L/opt/homebrew/lib -lSDL2 -framework OpenGL"
    passC = "-DCIMGUI_USE_OPENGL3 -I/opt/homebrew/include/SDL2"
  @end

  @if linux and not emscripten:
    passL = "-lGL"
    passC = "-DCIMGUI_USE_OPENGL3"
  @end

  # Windows: statically link SDL2 (zlib-licensed) so dingbat.exe is a single
  # file with no DLLs to ship. libSDL2.a is referenced by full path because
  # -lSDL2 would prefer the import lib (libSDL2.dll.a) in the same directory;
  # the -l list after it is SDL2's static Win32 dependencies.
  @if windows:
    # GUI subsystem: no console window opens behind the emulator. Trade-off:
    # stdout (echo/pacing logs) is invisible even when launched from a
    # terminal; use the console-subsystem test binaries for diagnostics.
    app = "gui"
    dynlibOverride = "SDL2"
    passC = "-DCIMGUI_USE_OPENGL3 -I/usr/x86_64-w64-mingw32/include/SDL2"
    passL = "/usr/x86_64-w64-mingw32/lib/libSDL2.a -lopengl32 -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid -static-libgcc -static-libstdc++"
    # Link with g++ so the C++ runtime needed by the imgui objects is pulled
    # in (Nim's default mingw linker is the C driver, which leaves
    # __cxa_guard_*/__gxx_personality_* unresolved).
    amd64.windows.gcc.linkerexe = "x86_64-w64-mingw32-g++"
  @end
@end

# Performance: disable threads (we're single-threaded) to avoid TLV overhead,
# and use ARC instead of ORC to eliminate cycle-collector cost.
threads = "off"
mm = "arc"

# Debug builds keep all runtime checks and stack traces, but compile the
# generated C with optimization: an -O0 debug build runs at half realtime,
# too slow for interactive testing, while opt:speed keeps the same checks and
# runs ~5x faster. -d:release/-d:danger already imply opt:speed.
opt = "speed"
