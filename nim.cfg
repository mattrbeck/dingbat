# macOS: link SDL2 statically via homebrew; link OpenGL framework
@if not test_harness:
  @if macosx and not emscripten:
    dynlibOverride = "SDL2"
    passC = "-DCIMGUI_USE_OPENGL3 -I/opt/homebrew/include/SDL2"
    # -d:macdist links SDL2 statically (framework list = `sdl2-config
    # --static-libs`) so the .app has no Homebrew dependency.
    @if macdist:
      passL = "/opt/homebrew/lib/libSDL2.a -lm -lobjc -framework OpenGL -Wl,-framework,CoreAudio -Wl,-framework,AudioToolbox -Wl,-weak_framework,CoreHaptics -Wl,-weak_framework,GameController -Wl,-framework,ForceFeedback -Wl,-framework,CoreVideo -Wl,-framework,Cocoa -Wl,-framework,Carbon -Wl,-framework,IOKit -Wl,-weak_framework,QuartzCore -Wl,-weak_framework,Metal"
    @else:
      passL = "-L/opt/homebrew/lib -lSDL2 -framework OpenGL"
    @end
  @end

  @if linux and not emscripten:
    # imgui's SDL2 backend does `#include <SDL.h>`, so the SDL2 include dir
    # must be on the path (/usr/include/SDL2 on Debian/Ubuntu and Fedora).
    # SDL2 stays dynamic here: the Nim wrapper dlopens libSDL2-2.0.so.0.
    passL = "-lGL"
    passC = "-DCIMGUI_USE_OPENGL3 -I/usr/include/SDL2"
  @end

  # Windows: static SDL2 so dingbat.exe ships alone. libSDL2.a by full path
  # because -lSDL2 would pick the import lib (libSDL2.dll.a); the -l list
  # after it is SDL2's static Win32 dependencies.
  @if windows:
    # GUI subsystem: no console window, so stdout is invisible; use the
    # console-subsystem test binaries for diagnostics.
    app = "gui"
    dynlibOverride = "SDL2"
    passC = "-DCIMGUI_USE_OPENGL3 -I/usr/x86_64-w64-mingw32/include/SDL2"
    passL = "/usr/x86_64-w64-mingw32/lib/libSDL2.a -lopengl32 -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid -static-libgcc -static-libstdc++"
    # Link with g++: the imgui objects need the C++ runtime
    # (__cxa_guard_*/__gxx_personality_*).
    amd64.windows.gcc.linkerexe = "x86_64-w64-mingw32-g++"
  @end
@end

# Single-threaded: threads off avoids TLV overhead, ARC avoids the cycle collector.
threads = "off"
mm = "arc"

# Debug builds keep runtime checks but optimize the generated C: -O0 runs at
# half realtime.
opt = "speed"

# Apple clang's AArch64 machine outliner (on at -O2+) turns the hottest
# straight-line code into call/return pairs; disabling it is ~+35% fps with
# pixel-identical output. Covers macOS and iOS; wasm has no equivalent pass.
@if arm64 and not emscripten:
  passC = "-mno-outline"
@end
